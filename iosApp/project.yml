name: iosApp
options:
  bundleIdPrefix: cz.mares
settings:
  base:
    SWIFT_ENABLE_EXPLICIT_MODULES: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.mares.zdravipm
        INFOPLIST_FILE: iosApp/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_ENABLE_EXPLICIT_MODULES: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]":
          - "$(inherited)"
          - "$(PROJECT_DIR)/../composeApp/build/bin/iosArm64/releaseFramework"
          - "$(PROJECT_DIR)/../composeApp/build/bin/iosArm64/debugFramework"
        "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]":
          - "$(inherited)"
          - "$(PROJECT_DIR)/../composeApp/build/bin/iosSimulatorArm64/releaseFramework"
          - "$(PROJECT_DIR)/../composeApp/build/bin/iosSimulatorArm64/debugFramework"
          - "$(PROJECT_DIR)/../composeApp/build/bin/iosX64/releaseFramework"
          - "$(PROJECT_DIR)/../composeApp/build/bin/iosX64/debugFramework"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-ObjC"
          - "-framework"
          - "ComposeApp"
